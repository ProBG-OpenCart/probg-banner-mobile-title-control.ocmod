name: Apply Mobile Dimensions To Banner Modules

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mobile-dimensions-all-modules.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/feat-mobile-dimensions-all-banner-modules
          fetch-depth: 0

      - name: Apply 1.2.0 changes
        run: python3 .github/scripts/apply_mobile_dimensions_1_2_0.py

      - name: Validate changes
        run: |
          set -euo pipefail
          php -l upload/admin/controller/extension/module/probg_banner_mobile.php
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('install.xml'); print('install.xml: OK')"
          grep -q '<version>1.2.0</version>' install.xml
          grep -q 'admin/controller/extension/module/carousel.php' install.xml
          grep -q 'admin/controller/extension/module/slideshow.php' install.xml
          grep -q 'catalog/controller/extension/module/carousel.php' install.xml
          grep -q 'catalog/controller/extension/module/slideshow.php' install.xml

      - name: Commit feature branch
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_mobile_dimensions_1_2_0.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add mobile dimensions to carousel and slideshow'
            git push origin HEAD:agent/feat-mobile-dimensions-all-banner-modules
          fi

      - name: Remove temporary workflow from main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          SHA=$(gh api repos/${GITHUB_REPOSITORY}/contents/.github/workflows/apply-mobile-dimensions-all-modules.yml?ref=main --jq .sha 2>/dev/null)
          if [ -n "$SHA" ]; then
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/contents/.github/workflows/apply-mobile-dimensions-all-modules.yml \
              -f message='chore: remove temporary mobile dimensions workflow' \
              -f sha="$SHA" \
              -f branch=main
          fi
