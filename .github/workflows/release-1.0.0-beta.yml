name: Release 1.0.0 Beta

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.0-beta.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build OCMOD package
        run: |
          PACKAGE='probg-banner-mobile-title-control-1.0.0-beta.ocmod.zip'
          rm -f "$PACKAGE"
          zip -r "$PACKAGE" install.xml upload -x '*.DS_Store'

      - name: Create beta tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='1.0.0-beta'
          PACKAGE='probg-banner-mobile-title-control-1.0.0-beta.ocmod.zip'

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # ProBG Banner Mobile & Title Control 1.0.0 Beta

          First beta release for OpenCart 3.

          ## feat

          - Added a separate mobile image for every standard banner image and language.
          - Added configurable mobile width and mobile height to standard Banner module instances.
          - Added per-banner **Hide Title** control.
          - Added responsive `<picture>` output for the default OpenCart banner template.
          - Added mobile-image and dimension fallback logic for existing banners.
          - Preserved the original banner title as image `alt` text when the visible title is hidden.
          - Added database installation logic for `mobile_image` and `hide_title`.
          - Added Bulgarian and English administration language files and documentation.

          **Status:** Beta / pre-release. Recommended for testing before production deployment.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --title '1.0.0 Beta' \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
