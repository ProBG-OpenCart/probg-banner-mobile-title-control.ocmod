name: Release 1.2.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.2.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.2.4</version>' install.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('install.xml')
          PY

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='probg-banner-mobile-title-control-1.2.4.ocmod.zip'
          mkdir -p dist
          rm -f "dist/$PACKAGE"
          zip -r "dist/$PACKAGE" install.xml upload -x '*.DS_Store'

          sha256sum "dist/$PACKAGE" > /tmp/newsum
          touch dist/SHA256SUMS
          grep -v "  $PACKAGE$" dist/SHA256SUMS > /tmp/sums || true
          cat /tmp/sums /tmp/newsum > dist/SHA256SUMS

      - name: Commit release package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: release 1.2.4 package'
            git push origin HEAD:main
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git reset --hard origin/main

          TAG='v1.2.4'
          PACKAGE='dist/probg-banner-mobile-title-control-1.2.4.ocmod.zip'

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # ProBG Banner Mobile & Title Control 1.2.4

          ## fix

          - Fixed `banner.mobile_image`, `banner.hide_title`, and `banner.alt` not reaching custom Banner, Carousel, and Slideshow Twig templates when another theme or OCMOD changes the standard frontend banner-array formatting.
          - Replaced the fragile multi-line `title/link/image` replacement with independent OCMOD operations for `title` and `image`.
          - Preserved the original banner title in `banner.alt`, exposed `banner.hide_title` explicitly, and exposed the resized `banner.mobile_image` independently from the desktop image.
          - Applied the same frontend data handling to Banner, Carousel, and Slideshow.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title '1.2.4' --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" --title '1.2.4' --notes-file /tmp/release-notes.md
          fi
