name: Release 1.0.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version 1.0.3
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's#<version>1\.0\.1</version>#<version>1.0.3</version>#' install.xml
          sed -i 's/Текуща версия: \*\*1\.0\.1\*\*/Текуща версия: **1.0.3**/' README.md
          sed -i 's/Current version: \*\*1\.0\.1\*\*/Current version: **1.0.3**/' README_EN.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [1.0.1]'
          entry = '''## [1.0.3] - 2026-08-30\n\n### fix\n\n- Added detailed manual integration instructions for OpenCart custom themes that override `extension/module/banner.twig`.\n- Added ready-to-use responsive `<picture>` markup using `banner.mobile_image`, `banner.image`, and `banner.alt`.\n- Documented manual `Hide Title` handling for custom themes that render visible banner captions.\n- Added guidance for custom breakpoints, lazy-loading themes, cache refresh, and theme updates that may overwrite manual template changes.\n\n'''

          if '## [1.0.3]' not in text:
              if marker in text:
                  text = text.replace(marker, entry + marker, 1)
              else:
                  text = text.rstrip() + '\n\n' + entry
              path.write_text(text, encoding='utf-8')
          PY

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='probg-banner-mobile-title-control-1.0.3.ocmod.zip'
          mkdir -p dist
          rm -f "dist/$PACKAGE"
          zip -r "dist/$PACKAGE" install.xml upload -x '*.DS_Store'

          sha256sum "dist/$PACKAGE" > /tmp/newsum
          touch dist/SHA256SUMS
          grep -v "  $PACKAGE$" dist/SHA256SUMS > /tmp/sums || true
          cat /tmp/sums /tmp/newsum > dist/SHA256SUMS

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.xml README.md README_EN.md CHANGELOG.md dist/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: release 1.0.3'
            git push origin HEAD:main
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git reset --hard origin/main

          TAG='v1.0.3'
          PACKAGE='dist/probg-banner-mobile-title-control-1.0.3.ocmod.zip'

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # ProBG Banner Mobile & Title Control 1.0.3

          ## fix

          - Added detailed manual integration instructions for OpenCart custom themes that override `extension/module/banner.twig`.
          - Added ready-to-use responsive `<picture>` markup using `banner.mobile_image`, `banner.image`, and `banner.alt`.
          - Documented manual `Hide Title` handling for custom themes that render visible banner captions.
          - Added guidance for custom breakpoints, lazy-loading themes, cache refresh, and theme updates that may overwrite manual template changes.

          Includes all fixes from 1.0.1, including automatic creation of missing `mobile_image` and `hide_title` database columns.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title '1.0.3' --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" \
              --title '1.0.3' \
              --notes-file /tmp/release-notes.md
          fi
