name: Apply 1.2.2 Mobile Persistence Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-1.2.2-mobile-persistence-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-dimensions-persistence
          fetch-depth: 0

      - name: Apply persistence fix
        run: python3 .github/scripts/apply-1.2.2-mobile-persistence-fix.py

      - name: Validate XML and controller anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('install.xml').getroot()
          assert root.findtext('version') == '1.2.2'
          paths = {
              'admin/controller/extension/module/banner.php',
              'admin/controller/extension/module/carousel.php',
              'admin/controller/extension/module/slideshow.php',
          }
          seen = set()
          for file_el in root.findall('file'):
              path = file_el.get('path')
              if path not in paths:
                  continue
              searches = [(op.findtext('search') or '').strip() for op in file_el.findall('operation')]
              assert "$data['breadcrumbs'] = array();" in searches
              assert "$data['header'] = $this->load->controller('common/header');" in searches
              assert 'return !$this->error;' in searches
              seen.add(path)
          assert seen == paths
          print('install.xml and controller anchors OK')
          PY

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-1.2.2-mobile-persistence-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.xml CHANGELOG.md README.md README_EN.md .github/scripts/
          git commit -m 'fix: persist mobile dimension settings reliably'
          git push origin HEAD:agent/fix-mobile-dimensions-persistence

# retry after structural validation correction
