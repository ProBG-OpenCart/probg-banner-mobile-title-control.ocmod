name: Rebuild 1.2.2 Persistence Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-1.2.2-persistence-fix.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-dimensions-persistence
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main

      - name: Rebuild minimal patch
        run: python3 .github/scripts/rebuild-1.2.2-persistence-fix.py

      - name: Validate minimal diff
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('install.xml').getroot(); assert r.findtext('version') == '1.2.2'"
          test "$(git diff --numstat origin/main -- install.xml | awk '{print $1+$2}')" -lt 80
          git diff --check origin/main
          git diff --stat origin/main

      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/rebuild-1.2.2-persistence-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.xml CHANGELOG.md README.md README_EN.md .github/scripts/
          git commit -m 'fix: keep mobile dimension settings after save'
          git push origin HEAD:agent/fix-mobile-dimensions-persistence
