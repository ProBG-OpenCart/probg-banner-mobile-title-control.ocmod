name: Release 1.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.1.0</version>' install.xml
          grep -q 'Текуща версия: \*\*1.1.0\*\*' README.md
          grep -q 'Current version: \*\*1.1.0\*\*' README_EN.md
          grep -q '## \[1.1.0\]' CHANGELOG.md

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='probg-banner-mobile-title-control-1.1.0.ocmod.zip'
          mkdir -p dist
          rm -f "dist/$PACKAGE"
          zip -r "dist/$PACKAGE" install.xml upload -x '*.DS_Store'

          sha256sum "dist/$PACKAGE" > /tmp/newsum
          touch dist/SHA256SUMS
          grep -v "  $PACKAGE$" dist/SHA256SUMS > /tmp/sums || true
          cat /tmp/sums /tmp/newsum > dist/SHA256SUMS

      - name: Commit release package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: add 1.1.0 installation package'
            git push origin HEAD:main
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git reset --hard origin/main

          TAG='v1.1.0'
          PACKAGE='dist/probg-banner-mobile-title-control-1.1.0.ocmod.zip'

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # ProBG Banner Mobile & Title Control 1.1.0

          ## feat

          - Added a conditional HTML `title` attribute to banner links using `banner.title`.
          - The link `title` attribute is omitted automatically when **Hide Title** is enabled because `banner.title` is empty.
          - Updated the custom-theme integration examples to use the same conditional link-title logic.

          Includes all fixes and features from previous releases.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title '1.1.0' --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" \
              --title '1.1.0' \
              --notes-file /tmp/release-notes.md
          fi
